[package]
name = "lylat-replay-uploader"
description = "Uploads finished online replays to Lylat."
version = "0.1.0"
authors = ["Lylat Team"]
edition = "2024"
publish = false

[dependencies]
dolphin-integrations = { path = "../dolphin" }
lzma-rust2 = { version = "0.24", default-features = false, features = ["std", "encoder", "xz"] }
serde_json = { workspace = true }
sha2 = "0.10"
tracing = { workspace = true }
ureq = { workspace = true }
